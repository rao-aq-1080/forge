[project]
name = "forge"
version = "2.0.0"
description = "Forge v2 — multi-agent AI software engineering team with repair loop, telemetry, streaming, diff viewer, GitHub export, Docker sandbox, and RAG."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
